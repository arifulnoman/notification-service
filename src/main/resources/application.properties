server.port=8081
spring.application.name=notification-service

# Master Database
master.datasource.url=jdbc:postgresql://localhost:5432/notification_db
master.datasource.username=postgres
master.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.security.user.name=admin
spring.security.user.password=admin

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Per-service queues are no longer listed here — they are provisioned at
# runtime by the service registry (POST /api/admin/services). See
# com.notification_service.registry.ServiceRegistryService.
rabbitmq.exchange=notification.exchange
rabbitmq.queue.dead-letter=notification.dead-letter.queue

# JWT — there is no shared secret. Every service verifies with its own
# registered public key (see com.notification_service.security.JwtTokenProvider
# and POST /api/admin/services).

# Admin API (service registry onboarding) — a credential separate from
# any service's JWT signing key. Override per environment; never commit a real value.
admin.api-key=CHANGE-ME-ADMIN-API-KEY

# Suppress Hibernate JDBC Environment logs in console
logging.level.org.hibernate.orm.connections.pooling=WARN
