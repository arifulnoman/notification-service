server.port=8081
spring.application.name=notification-service

# Master Database
master.datasource.url=jdbc:postgresql://localhost:5432/notification_db
master.datasource.username=postgres
master.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.security.user.name=admin
spring.security.user.password=admin

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Each source system that publishes notifications gets its own queue.
rabbitmq.queues=erp.notification.queue,hrms.notification.queue
rabbitmq.exchange=notification.exchange
rabbitmq.queue.dead-letter=notification.dead-letter.queue
# JWT
jwt.secret=NOTIFICATION-SECRET-KEY-256-LONG-ENOUGH-FOR-SECURITY
jwt.expiration-milliseconds=86400000

# Suppress Hibernate JDBC Environment logs in console
logging.level.org.hibernate.orm.connections.pooling=WARN
